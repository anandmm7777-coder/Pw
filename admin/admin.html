====================== -->


<section class="panel">

placeholder="Chapter Name">

</option>


<option>

</option>

</button>

====================== -->


<section class="panel">


<h2>

Add Lecture
</h2>



<div class="form-grid">


<select id="lectureChapter">


<option>

Select Chapter

</option>


</select>



<input

id="lectureTitle"

type="text"

placeholder="Lecture Title">



<input

id="lectureDuration"

type="text"

placeholder="Duration (45 min)">



<input

id="lectureVideo"

type="text"

placeholder="Video Link">



<input

id="lectureNotes"

type="text"

placeholder="Notes Link">



<button id="addLectureBtn">

</button>

</section>



<div class="search-admin">

type="text"

id="searchAdminLecture"

>

</tbody>



</table>

  // ===============================
// Admin Notification System
// ===============================
 let notifications=JSON.parse(localStorage.getItem("notifications"))||[];

function sendNotification(title,message){

    notifications=JSON.parse(localStorage.getItem("notifications"))||[];

    notifications.push({

        title:title,

        message:message,

        time:new Date().toLocaleString()

    });

    localStorage.setItem(

        "notifications",

        JSON.stringify(notifications)

    );

    localStorage.setItem(

        "notificationRead",

        "false"

    );
  showToast(title);

    alert("Notification Sent");

}
